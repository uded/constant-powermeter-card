name: Refresh release notes

# Rewrites the notes of an existing release from CHANGELOG.md on main,
# without rebuilding or re-uploading the bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.5
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🏷️ Validate the tag name
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: 📝 Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/release-notes.sh "$TAG" > "${RUNNER_TEMP}/notes.md"

      - name: ✏️ Update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
