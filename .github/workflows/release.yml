name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: 🧰 Set up go-task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint, typecheck and test
        run: task check

      - name: 🏗️ Build
        run: task build

      - name: 🧾 Verify the committed bundle is up to date
        run: git diff --exit-code dist/ && test -z "$(git status --porcelain dist/)"

      - name: 🏷️ Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: 🚀 Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/constant-powermeter-card.js
          generate_release_notes: true
